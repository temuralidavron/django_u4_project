<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Yaratish</title>
</head>
<body>

<h2>Yangi Blog Postini Yaratish</h2>

<form method="POST">
    {% csrf_token %}
    <label for="title">Blog Post Nomi:</label>
    <input type="text" id="title" name="title" required><br><br>

    <label for="content">Blog Post Matni:</label><br>
    <textarea id="content" name="content" rows="4" cols="50" required></textarea><br><br>

    <button type="submit">Yuborish</button>
</form>

</body>
</html>
